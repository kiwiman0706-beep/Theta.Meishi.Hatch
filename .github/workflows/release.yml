# Raise the version (android/app/build.gradle, desktop/ and web/package.json, docs/releases/
# v<version>.md) and push to the default branch: when there is no tag v<version> yet, this makes
# the tag and the Release (series spec §6.1 #2). Pushes without a new version do nothing.
# Also runs for a pushed tag like v0.14.0, or by hand (Actions → Release → Run workflow)
# → tests, then the Android APK, the Windows installer and the Mac builds, published together as
# one GitHub Release (the apps check it for updates).
# Run by hand with "ref", an earlier commit is built and released (e.g. a bridge version kept
# behind newer work on the branch).
# The APK is signed only when the repository secrets ANDROID_KEYSTORE_B64 and
# ANDROID_KEYSTORE_PASSWORD are set (see docs/RELEASING.md). GitHub's own token cannot make a tag
# on a commit that changes .github/workflows: a RELEASE_TOKEN secret (a personal token with
# Contents and Workflows write) is used instead when set.
name: Release

on:
  push:
    branches: ["**"] # only the default branch releases (checked below)
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit to build and release (empty: the branch's latest). E.g. the bridge version's commit"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04 # Playwright does not run on 26.04 yet
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      go: ${{ steps.new.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref || github.sha }}" }
      - id: v
        name: Version (tag, Android and desktop agree?)
        run: |
          android="$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" android/app/build.gradle)"
          desktop="$(node -p 'require("./desktop/package.json").version')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="${GITHUB_REF_NAME#v}"; else tag="$android"; fi
          echo "tag=$tag android=$android desktop=$desktop"
          ok=true
          { test "$tag" = "$android" && test "$tag" = "$desktop" && test -f "docs/releases/v$tag.md"; } || ok=false
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "tag=v$tag" >> "$GITHUB_OUTPUT"
      - id: new
        name: Is there something to release?
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          DEFAULT: ${{ github.event.repository.default_branch }}
          OK: ${{ steps.v.outputs.ok }}
        run: |
          go=true
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ]; then
            # A push to a branch releases only on the default branch, and only a version not yet tagged.
            if [ "$GITHUB_REF_NAME" != "$DEFAULT" ]; then go=false
            elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then go=false; fi
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            # A tag made by this workflow (with RELEASE_TOKEN) starts it again: done when the APK is there.
            if gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '\.apk$'; then go=false; fi
          fi
          echo "go=$go"
          echo "go=$go" >> "$GITHUB_OUTPUT"
          # Only a release needs the versions to agree and its notes (docs/releases/v<version>.md).
          if [ "$go" = true ] && [ "$OK" != true ]; then
            echo "::error::The versions of android/app/build.gradle and desktop/package.json differ (or from the tag), or docs/releases/$TAG.md is missing"
            exit 1
          fi

  test:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-24.04 # Playwright does not run on 26.04 yet
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref || github.sha }}" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Desktop tests
        working-directory: desktop
        run: npm ci && npm test
      - name: Android unit tests
        working-directory: android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          ./gradlew testReleaseUnitTest --no-daemon
      - name: UI tests (Chromium)
        run: |
          npm install -g playwright@1.56.1
          npx playwright install --with-deps chromium
          NODE_PATH="$(npm root -g)" node android/tests/ui.test.cjs
          NODE_PATH="$(npm root -g)" node desktop/test/e2e/ui.e2e.cjs
      - name: Web version (unit, build, browser)
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
          NODE_PATH="$(npm root -g)" node test/e2e.cjs

  android:
    needs: test
    runs-on: ubuntu-24.04 # Playwright does not run on 26.04 yet
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref || github.sha }}" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Signed APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::warning::ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS are not set: no APK in this release"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          printf '%s' "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/signing/password.txt"
          printf '%s' "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" > "$RUNNER_TEMP/signing/key-password.txt"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          SIGNING_FILE="$RUNNER_TEMP/signing/release.jks" SIGNING_PASS_FILE="$RUNNER_TEMP/signing/password.txt" SIGNING_KEY_PASS_FILE="$RUNNER_TEMP/signing/key-password.txt" android/build.sh
          rm -rf "$RUNNER_TEMP/signing"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/build/ThetaMeishiHatch-*.apk
          if-no-files-found: ignore

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Installer and zip
        working-directory: desktop
        run: npm ci && npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.exe.blockmap
            desktop/dist/*.zip
            desktop/dist/latest.yml
          if-no-files-found: error

  mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: dmg and zip (Apple silicon and Intel)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm ci && npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/latest-mac.yml
          if-no-files-found: error

  release:
    needs: [check, android, windows, mac]
    runs-on: ubuntu-24.04 # Playwright does not run on 26.04 yet
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref || github.sha }}" }
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          ls -la out
          # Re-running (e.g. after adding the signing secrets) adds or replaces the files.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            # Run by hand, the tag is created on this commit.
            gh release create "$TAG" out/* \
              --target "$(git rev-parse HEAD)" \
              --title "Theta Meishi Hatch ${{ needs.check.outputs.version }}" \
              --notes-file "docs/releases/$TAG.md"
          fi
